<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Mechanical Keyboard</title>
  <link rel="stylesheet" href="keyboard.css">
  <script src="keyboard.js" defer></script>
</head>

<body>
  
  <div class="keyboard-wrapper">
    <div class="mobile-hint">📱 Rotate to landscape or scroll horizontally for full view</div>
    <div class="keyboard">
      <div class="row">
        <div class="key" data-code="Escape">
          <div class="letter">esc</div>
        </div>
        <div class="key" data-code="F1">
          <div class="letter">F1</div>
        </div>
        <div class="key" data-code="F2">
          <div class="letter">F2</div>
        </div>
        <div class="key" data-code="F3">
          <div class="letter">F3</div>
        </div>
        <div class="key" data-code="F4">
          <div class="letter">F4</div>
        </div>
        <div class="key" data-code="F5">
          <div class="letter">F5</div>
        </div>
        <div class="key" data-code="F6">
          <div class="letter">F6</div>
        </div>
        <div class="key" data-code="F7">
          <div class="letter">F7</div>
        </div>
        <div class="key" data-code="F8">
          <div class="letter">F8</div>
        </div>
        <div class="key" data-code="F9">
          <div class="letter">F9</div>
        </div>
        <div class="key" data-code="F10">
          <div class="letter">F10</div>
        </div>
        <div class="key" data-code="F11">
          <div class="letter">F11</div>
        </div>
        <div class="key" data-code="F12">
          <div class="letter">F12</div>
        </div>
        <div class="key print-sc" data-code="PrintScreen">
          <div class="letter">prt scn</div>
        </div>
      </div>

      <div class="row">
        <div class="key" data-code="Backquote">
          <div class="letter">`</div>
        </div>
        <div class="key" data-code="Digit1">
          <div class="letter">1</div>
        </div>
        <div class="key" data-code="Digit2">
          <div class="letter">2</div>
        </div>
        <div class="key" data-code="Digit3">
          <div class="letter">3</div>
        </div>
        <div class="key" data-code="Digit4">
          <div class="letter">4</div>
        </div>
        <div class="key" data-code="Digit5">
          <div class="letter">5</div>
        </div>
        <div class="key" data-code="Digit6">
          <div class="letter">6</div>
        </div>
        <div class="key" data-code="Digit7">
          <div class="letter">7</div>
        </div>
        <div class="key" data-code="Digit8">
          <div class="letter">8</div>
        </div>
        <div class="key" data-code="Digit9">
          <div class="letter">9</div>
        </div>
        <div class="key" data-code="Digit0">
          <div class="letter">0</div>
        </div>
        <div class="key" data-code="Minus">
          <div class="letter">-</div>
        </div>
        <div class="key" data-code="Equal">
          <div class="letter">=</div>
        </div>
        <div class="key delete-key" data-code="Backspace">
          <div class="letter">← delete</div>
        </div>
      </div>

      <div class="row">
        <div class="key tab-key" data-code="Tab">
          <div class="letter">tab ⮂</div>
        </div>
        <div class="key" data-code="KeyQ">
          <div class="letter">Q</div>
        </div>
        <div class="key" data-code="KeyW">
          <div class="letter">W</div>
        </div>
        <div class="key" data-code="KeyE">
          <div class="letter">E</div>
        </div>
        <div class="key" data-code="KeyR">
          <div class="letter">R</div>
        </div>
        <div class="key" data-code="KeyT">
          <div class="letter">T</div>
        </div>
        <div class="key" data-code="KeyY">
          <div class="letter">Y</div>
        </div>
        <div class="key" data-code="KeyU">
          <div class="letter">U</div>
        </div>
        <div class="key" data-code="KeyI">
          <div class="letter">I</div>
        </div>
        <div class="key" data-code="KeyO">
          <div class="letter">O</div>
        </div>
        <div class="key" data-code="KeyP">
          <div class="letter">P</div>
        </div>
        <div class="key" data-code="BracketLeft">
          <div class="letter">[</div>
        </div>
        <div class="key" data-code="BracketRight">
          <div class="letter">]</div>
        </div>
        <div class="key backslash-key" data-code="Backslash">
          <div class="letter">\</div>
        </div>
      </div>

      <div class="row">
        <div class="key caps-lock-key" data-code="CapsLock">
          <div class="letter">caps lock</div>
        </div>
        <div class="key" data-code="KeyA">
          <div class="letter">A</div>
        </div>
        <div class="key" data-code="KeyS">
          <div class="letter">S</div>
        </div>
        <div class="key" data-code="KeyD">
          <div class="letter">D</div>
        </div>
        <div class="key" data-code="KeyF">
          <div class="letter">F</div>
        </div>
        <div class="key" data-code="KeyG">
          <div class="letter">G</div>
        </div>
        <div class="key" data-code="KeyH">
          <div class="letter">H</div>
        </div>
        <div class="key" data-code="KeyJ">
          <div class="letter">J</div>
        </div>
        <div class="key" data-code="KeyK">
          <div class="letter">K</div>
        </div>
        <div class="key" data-code="KeyL">
          <div class="letter">L</div>
        </div>
        <div class="key" data-code="Semicolon">
          <div class="letter">;</div>
        </div>
        <div class="key" data-code="Quote">
          <div class="letter">'</div>
        </div>
        <div class="key return-key" data-code="Enter">
          <div class="letter">↵ Enter</div>
        </div>
      </div>

      <div class="row">
        <div class="key shift-key" data-code="ShiftLeft">
          <div class="letter">⬆ Shift</div>
        </div>
        <div class="key" data-code="KeyZ">
          <div class="letter">Z</div>
        </div>
        <div class="key" data-code="KeyX">
          <div class="letter">X</div>
        </div>
        <div class="key" data-code="KeyC">
          <div class="letter">C</div>
        </div>
        <div class="key" data-code="KeyV">
          <div class="letter">V</div>
        </div>
        <div class="key" data-code="KeyB">
          <div class="letter">B</div>
        </div>
        <div class="key" data-code="KeyN">
          <div class="letter">N</div>
        </div>
        <div class="key" data-code="KeyM">
          <div class="letter">M</div>
        </div>
        <div class="key" data-code="Comma">
          <div class="letter">,</div>
        </div>
        <div class="key" data-code="Period">
          <div class="letter">.</div>
        </div>
        <div class="key" data-code="Slash">
          <div class="letter">/</div>
        </div>
        <div class="key shift-key-2" data-code="ShiftRight">
          <div class="letter">⬆ shift</div>
        </div>
      </div>

      <div class="row">
        <div class="key" data-code="ControlLeft">
          <div class="letter">Ctrl</div>
        </div>
        <div class="key" data-code="Fn">
          <div class="letter">fn</div>
        </div>
        <div class="key" data-code="AltLeft">
          <div class="letter">⌥</div>
        </div>
        <div class="key" data-code="MetaLeft">
          <div class="letter">⌘</div>
        </div>
        <div class="key spacekey" data-code="Space">
          <div class="letter">space</div>
        </div>
        <div class="key" data-code="MetaRight">
          <div class="letter">⌘</div>
        </div>
        <div class="key" data-code="AltRight">
          <div class="letter">⌥</div>
        </div>
        <div class="key" data-code="ArrowLeft">
          <div class="letter">◀</div>
        </div>
        <div class="key" data-code="ArrowDown">
          <div class="letter">▼</div>
        </div>
        <div class="key" data-code="ArrowUp">
          <div class="letter">▲</div>
        </div>
        <div class="key" data-code="ArrowRight">
          <div class="letter">▶</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
